name: ci

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_LOCAL: devsecops-tp1-api:local
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  DIVE_IMAGE: wagoodman/dive:v0.13.1@sha256:f1886e6c32c094fc41a623c1989f5cb3e48aa766da5f0be233f911fc1d85ce10
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

defaults:
  run:
    shell: bash

jobs:
  flake8:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --no-cache-dir -r requirements-dev.txt
      - run: python -m flake8 .

  hadolint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -i
          -v "${GITHUB_WORKSPACE}/.hadolint.yaml:/.config/hadolint.yaml:ro"
          "${HADOLINT_IMAGE}" hadolint --config /.config/hadolint.yaml - < Dockerfile

  build:
    needs:
      - flake8
      - hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          tags: ${{ env.IMAGE_LOCAL }}
          outputs: type=docker,dest=${{ runner.temp }}/api-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker load --input "${RUNNER_TEMP}/api-image.tar"
      - run: >-
          docker run --rm -e CI=true
          -v /var/run/docker.sock:/var/run/docker.sock
          "${DIVE_IMAGE}" --ci --lowestEfficiency=0.8 "${IMAGE_LOCAL}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-image
          path: ${{ runner.temp }}/api-image.tar
          retention-days: 1
          if-no-files-found: error

name: ci

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_LOCAL: devsecops-tp1-api:local
  IMAGE_REMOTE: ghcr.io/freeze060/devsecops-tp1
  BINFMT_IMAGE: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  DIVE_IMAGE: wagoodman/dive:v0.13.1@sha256:f1886e6c32c094fc41a623c1989f5cb3e48aa766da5f0be233f911fc1d85ce10
  SYFT_IMAGE: anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

defaults:
  run:
    shell: bash

jobs:
  flake8:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --no-cache-dir -r requirements-dev.txt
      - run: python -m flake8 .

  hadolint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -i
          -v "${GITHUB_WORKSPACE}/.hadolint.yaml:/.config/hadolint.yaml:ro"
          "${HADOLINT_IMAGE}" hadolint --config /.config/hadolint.yaml - < Dockerfile

  build:
    needs:
      - flake8
      - hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ fromJSON(steps.bake.outputs.metadata).api['containerimage.digest'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: generer le secret de build
        run: |
          token="$(openssl rand -hex 24)"
          echo "::add-mask::${token}"
          mkdir -p secrets
          printf '%s' "${token}" > secrets/pip_token.txt
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e
        with:
          source: .
          files: docker-bake.hcl
          targets: api
          set: |
            api.tags=${{ env.IMAGE_REMOTE }}
            api.output=type=image,push-by-digest=true,name-canonical=true,push=true
      - name: dive
        env:
          DIGEST: ${{ fromJSON(steps.bake.outputs.metadata).api['containerimage.digest'] }}
        run: |
          docker pull "${IMAGE_REMOTE}@${DIGEST}"
          docker run --rm -e CI=true \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "${DIVE_IMAGE}" --ci --lowestEfficiency=0.8 "${IMAGE_REMOTE}@${DIGEST}"

  sbom:
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      SYFT_REGISTRY_AUTH_AUTHORITY: ghcr.io
      SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
      SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: syft
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --tmpfs /tmp:rw,mode=1777
          -e HOME=/tmp
          -e SYFT_REGISTRY_AUTH_AUTHORITY
          -e SYFT_REGISTRY_AUTH_USERNAME
          -e SYFT_REGISTRY_AUTH_PASSWORD
          -v "${GITHUB_WORKSPACE}:/out"
          "${SYFT_IMAGE}" "registry:${IMAGE_REMOTE}@${DIGEST}"
          --platform linux/amd64
          -o cyclonedx-json=/out/sbom.cdx.json
          -o spdx-json=/out/sbom.spdx.json
      - name: interroger le sbom
        run: |
          echo "composants CycloneDX : $(jq '.components | length' sbom.cdx.json)"
          echo "paquets avec PURL    : $(jq '[.components[] | select(.purl)] | length' sbom.cdx.json)"
          echo "paquets SPDX         : $(jq '.packages | length' sbom.spdx.json)"
          jq -r '.components[] | select(.purl) | .purl' sbom.cdx.json
          jq -r '[.components[] | select(.purl) | .licenses[]? | .license.id // .license.name // .expression] | unique | .[]' sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.spdx.json
          retention-days: 90
          if-no-files-found: error

  trivy:
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      PLATFORM: ${{ matrix.platform }}
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: trivy image
        run: >-
          docker run --rm
          -e TRIVY_USERNAME -e TRIVY_PASSWORD
          -v trivy-cache:/root/.cache/trivy
          "${TRIVY_IMAGE}" image --image-src remote --platform "${PLATFORM}"
          --scanners vuln
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          "${IMAGE_REMOTE}@${DIGEST}"
      - name: trivy secret
        run: >-
          docker run --rm
          -e TRIVY_USERNAME -e TRIVY_PASSWORD
          -v trivy-cache:/root/.cache/trivy
          "${TRIVY_IMAGE}" image --image-src remote --platform "${PLATFORM}"
          --scanners secret --exit-code 1
          "${IMAGE_REMOTE}@${DIGEST}"
      - name: trivy fs
        if: matrix.platform == 'linux/amd64'
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/src:ro"
          -v trivy-cache:/root/.cache/trivy
          "${TRIVY_IMAGE}" fs --scanners vuln
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          /src

  integration:
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: recuperer l'image testee
        run: |
          docker pull "${IMAGE_REMOTE}@${DIGEST}"
          docker tag "${IMAGE_REMOTE}@${DIGEST}" "${IMAGE_LOCAL}"
      - name: generer le .env et le secret
        run: |
          cp .env.example .env
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          mkdir -p secrets
          printf '%s' "${password}" > secrets/db_password.txt
      - name: demarrer la stack
        run: docker compose up --detach --no-build --wait --wait-timeout 120
      - run: docker compose ps
      - name: tester /health
        run: curl --fail --silent --show-error --max-time 5 http://localhost:5000/health
      - name: tester /dbtest
        run: curl --fail --silent --show-error --max-time 5 http://localhost:5000/dbtest
      - name: pytest
        run: docker compose --profile test run --rm tests
      - name: journaux en cas d'echec
        if: failure()
        run: |
          docker compose --profile test ps --all
          docker compose --profile test logs
      - name: teardown
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - sbom
      - trivy
      - integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE_REMOTE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: publier l'index audite
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            args+=(--tag "${tag}")
          done <<< "${TAGS}"
          docker buildx imagetools create "${args[@]}" "${IMAGE_REMOTE}@${DIGEST}"
      - name: verifier le manifeste multi-arch
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE_REMOTE}:${VERSION}"
